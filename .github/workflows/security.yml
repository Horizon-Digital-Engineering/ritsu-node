name: Security
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 6 * * 0'

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency review (PR only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          # Cargo licence policy lives in deny.toml; this list only names what is never acceptable anywhere.
          deny-licenses: GPL-3.0, GPL-3.0-or-later, AGPL-3.0, AGPL-3.0-or-later, SSPL-1.0
          # The secret scanner is AGPL but runs only in CI and links nothing into the binary.
          allow-dependencies-licenses: pkg:githubactions/trufflesecurity/trufflehog
          comment-summary-in-pr: on-failure

  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: |
          set -eo pipefail
          VERSION=1.7.12
          BASE="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          curl -fsSLO "${BASE}/actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -fsSLO "${BASE}/actionlint_${VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "actionlint_${VERSION}_checksums.txt"
          sudo tar -xzf "actionlint_${VERSION}_linux_amd64.tar.gz" -C /usr/local/bin actionlint
          actionlint -version
      - run: actionlint -color

  secrets-trufflehog:
    name: Secret scan (trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@4dd8831c5f12599465d4d45c3c447b4018a34c85 # v3.97.9
        with:
          version: 3.97.1
          extra_args: --only-verified

  secrets-gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -eo pipefail
          VERSION=8.30.1
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          curl -fsSLO "${BASE}/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSLO "${BASE}/gitleaks_${VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${VERSION}_checksums.txt"
          sudo tar -xzf "gitleaks_${VERSION}_linux_x64.tar.gz" -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks detect
        run: |
          set -eo pipefail
          echo "## Gitleaks" >> "$GITHUB_STEP_SUMMARY"
          if gitleaks detect --source . --redact --no-banner --exit-code 1 --report-format sarif --report-path gitleaks.sarif; then
            echo "OK no secrets found" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "FAIL gitleaks found leaks (see job log; sarif uploaded as artifact)" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: gitleaks-sarif
          path: gitleaks.sarif
          if-no-files-found: ignore

  # cargo-deny already checks the RustSec advisory DB with the ignore list in deny.toml; a separate cargo-audit job would duplicate it.
  cargo-deny:
    name: License + supply-chain (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1, pins cargo-deny 0.20.2
        with:
          command: check
          arguments: --all-features

  semgrep:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.163.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: semgrep scan
        run: |
          set -eo pipefail
          if semgrep scan --config auto --error --exclude target 2>&1 | tee semgrep.txt; then
            {
              echo "## Semgrep SAST"
              echo "OK no findings"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Semgrep SAST"
              echo "FAIL findings:"
              echo '```'
              cat semgrep.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
