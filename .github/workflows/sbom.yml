name: SBOM
on:
  # Publishing a release with GITHUB_TOKEN raises no events, so the release workflow (lands with the first binary) will call this directly; dispatch attaches to an existing release by hand.
  workflow_call:
    inputs:
      tag:
        description: The release tag to attach to
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to attach to
        required: true
        type: string

permissions:
  contents: read

jobs:
  sbom:
    name: Generate + attach SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      # github.* data goes through env, never into the script text.
      REF_NAME: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          format: cyclonedx-json
          artifact-name: ritsu-node-${{ inputs.tag }}-sbom.cdx.json
          output-file: ritsu-node-${{ inputs.tag }}-sbom.cdx.json

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          format: spdx-json
          artifact-name: ritsu-node-${{ inputs.tag }}-sbom.spdx.json
          output-file: ritsu-node-${{ inputs.tag }}-sbom.spdx.json

      - name: Attest SBOM build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'ritsu-node-*-sbom.*.json'

      # Scorecard's Signed-Releases check looks for .intoto.jsonl beside the release assets.
      - name: Stage attestation bundle as a release asset
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -eo pipefail
          cp "$BUNDLE_PATH" "ritsu-node-${REF_NAME}-provenance.intoto.jsonl"
          ls -la ritsu-node-*

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Keyless: the signing identity is this workflow's OIDC token; one bundle holds signature and certificate.
      - name: Sign SBOMs with cosign (keyless)
        run: |
          set -eo pipefail
          for f in ritsu-node-*-sbom.*.json; do
            cosign sign-blob --yes --bundle "${f}.sigstore.json" "$f"
          done
          ls -la ritsu-node-*-sbom.*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: |
            ritsu-node-*-sbom.cdx.json
            ritsu-node-*-sbom.spdx.json
            ritsu-node-*-sbom.*.json.sigstore.json
            ritsu-node-*-provenance.intoto.jsonl

      - name: Attach SBOMs + signatures + provenance to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$REF_NAME" \
            ritsu-node-*-sbom.cdx.json ritsu-node-*-sbom.spdx.json \
            ritsu-node-*-sbom.*.json.sigstore.json \
            ritsu-node-*-provenance.intoto.jsonl \
            --clobber
